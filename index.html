<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#1f7a45">

  <link rel="manifest" href="manifest.json">

  <title>KG Farms</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    /* HEADER */

    header {
      background: #1f7a45;
      color: white;
      padding: 20px 18px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    /* MAIN */

    .container {
      padding: 16px;
      max-width: 700px;
      margin: auto;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0 12px;
    }

    /* SUMMARY */

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.07);
    }

    .summary-label {
      font-size: 13px;
      color: #777;
      margin-bottom: 7px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: bold;
    }

    /* FARM CARD */

    .farm-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 13px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.07);
    }

    .farm-name {
      font-size: 18px;
      font-weight: bold;
    }

    .batch {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .divider {
      height: 1px;
      background: #eeeeee;
      margin: 13px 0;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 14px;
    }

    .data-label {
      color: #666;
    }

    .data-value {
      font-weight: 600;
      text-align: right;
    }

    .balance-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #fff4df;
    }

    .balance-label {
      font-size: 13px;
      color: #666;
    }

    .balance-value {
      margin-top: 4px;
      font-size: 21px;
      font-weight: bold;
    }

    .order-status {
      margin-top: 11px;
      font-size: 14px;
      font-weight: bold;
    }

    /* BUTTON */

    .refresh-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: #1f7a45;
      color: white;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .refresh-button:active {
      transform: scale(0.98);
    }

    /* LOADING */

    .loading {
      text-align: center;
      padding: 35px 10px;
      color: #777;
    }

    .error {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      color: #b00020;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      color: #777;
    }

  </style>
</head>

<body>

<header>

  <h1>KG Farms</h1>

  <p>Farm Management</p>

</header>


<div class="container">

  <!-- SUMMARY -->

  <div class="section-title">
    Overview
  </div>

  <div class="summary-grid">

    <div class="summary-card">

      <div class="summary-label">
        Active Farms
      </div>

      <div class="summary-value"
           id="totalFarms">
        -
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Total Birds
      </div>

      <div class="summary-value"
           id="totalBirds">
        -
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Feed To Supply
      </div>

      <div class="summary-value"
           id="totalFeed">
        -
      </div>

      <div class="summary-label">
        bags
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Orders Required
      </div>

      <div class="summary-value"
           id="ordersRequired">
        -
      </div>

    </div>

  </div>


  <!-- REFRESH -->

  <button class="refresh-button"
          onclick="loadDashboard()">

    Refresh Dashboard

  </button>


  <!-- FARM LIST -->

  <div class="section-title">
    Farm Overview
  </div>

  <div id="farmList">

    <div class="loading">
      Loading farm data...
    </div>

  </div>

</div>


<script>

  // ==========================================================
  // APPS SCRIPT WEB APP
  // ==========================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzVV9-kxrknNyQroHlnY49lhrw7lWgPkNB8AmxkC_UgISCiaSxYrF1KsxRe2AGcku0B/exec";


  // ==========================================================
  // LOAD DASHBOARD
  // ==========================================================

  async function loadDashboard() {

    const farmList =
      document.getElementById("farmList");

    farmList.innerHTML = `
      <div class="loading">
        Loading farm data...
      </div>
    `;


    try {

      const response =
        await fetch(API_URL);


      if (!response.ok) {

        throw new Error(
          "Network request failed"
        );

      }


      const result =
        await response.json();


      if (result.status !== "success") {

        throw new Error(
          "API returned an error"
        );

      }


      const data =
        result.data;


      if (!data || data.length <= 1) {

        document.getElementById(
          "totalFarms"
        ).textContent = "0";

        document.getElementById(
          "totalBirds"
        ).textContent = "0";

        document.getElementById(
          "totalFeed"
        ).textContent = "0";

        document.getElementById(
          "ordersRequired"
        ).textContent = "0";


        farmList.innerHTML = `
          <div class="empty">
            No active farms found.
          </div>
        `;

        return;

      }


      // First row = headers
      const rows =
        data.slice(1);


      // ========================================================
      // SUMMARY CALCULATIONS
      // ========================================================

      let totalBirds = 0;

      let totalFeedBalance = 0;

      let ordersRequired = 0;


      rows.forEach(row => {

        const birds =
          Number(row[2]) || 0;

        const balance =
          Number(row[7]) || 0;

        const status =
          row[8] || "";


        totalBirds += birds;

        totalFeedBalance += balance;


        if (
          status === "ORDER REQUIRED"
        ) {

          ordersRequired++;

        }

      });


      document.getElementById(
        "totalFarms"
      ).textContent = rows.length;


      document.getElementById(
        "totalBirds"
      ).textContent =
        totalBirds.toLocaleString();


      document.getElementById(
        "totalFeed"
      ).textContent =
        totalFeedBalance;


      document.getElementById(
        "ordersRequired"
      ).textContent =
        ordersRequired;


      // ========================================================
      // FARM CARDS
      // ========================================================

      farmList.innerHTML = "";


      rows.forEach(row => {

        const farm =
          row[0] || "";

        const batch =
          row[1] || "";

        const birds =
          row[2] || "";

        const age =
          row[3] || "";

        const feed =
          row[4] || "";

        const required =
          row[5] || "";

        const supplied =
          row[6] || "";

        const balance =
          row[7] || "";

        const status =
          row[8] || "";


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "farm-card";


        card.innerHTML = `

          <div class="farm-name">
            ${escapeHtml(farm)}
          </div>

          <div class="batch">
            Batch: ${escapeHtml(batch)}
          </div>


          <div class="divider"></div>


          <div class="data-row">

            <span class="data-label">
              Birds
            </span>

            <span class="data-value">
              ${escapeHtml(birds)}
            </span>

          </div>


          <div class="data-row">

            <span class="data-label">
              Age
            </span>

            <span class="data-value">
              ${
                age
                ? "Day " + escapeHtml(age)
                : "-"
              }
            </span>

          </div>


          <div class="data-row">

            <span class="data-label">
              Current Feed
            </span>

            <span class="data-value">
              ${
                escapeHtml(feed || "-")
              }
            </span>

          </div>


          <div class="data-row">

            <span class="data-label">
              Feed Required
            </span>

            <span class="data-value">
              ${
                required
                ? escapeHtml(required)
                  + " bags"
                : "-"
              }
            </span>

          </div>


          <div class="data-row">

            <span class="data-label">
              Feed Supplied
            </span>

            <span class="data-value">
              ${
                supplied
                ? escapeHtml(supplied)
                  + " bags"
                : "-"
              }
            </span>

          </div>


          ${
            balance !== ""
            ?
            `
              <div class="balance-box">

                <div class="balance-label">
                  Feed To Be Supplied
                </div>

                <div class="balance-value">
                  ${escapeHtml(balance)} bags
                </div>

              </div>
            `
            :
            ""
          }


          ${
            status
            ?
            `
              <div class="order-status">
                ${escapeHtml(status)}
              </div>
            `
            :
            ""
          }

        `;


        farmList.appendChild(card);

      });


    }

    catch (error) {

      console.error(error);


      farmList.innerHTML = `

        <div class="error">

          Unable to load farm data.

          <br><br>

          Please check your internet
          connection.

        </div>

      `;

    }

  }


  // ==========================================================
  // HTML SAFETY
  // ==========================================================

  function escapeHtml(value) {

    return String(value)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  // ==========================================================
  // SERVICE WORKER
  // ==========================================================

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("sw.js")

          .then(() => {

            console.log(
              "KG Farms PWA ready"
            );

          })

          .catch(error => {

            console.log(
              "Service worker error:",
              error
            );

          });

      }
    );

  }


  // ==========================================================
  // INITIAL LOAD
  // ==========================================================

  loadDashboard();

</script>

</body>
</html>
