<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0,user-scalable=no">

  <title>KG Farms</title>

  <meta name="theme-color" content="#166534">
  <meta name="mobile-web-app-capable" content="yes">

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: #f4f6f8;
    }

    /* ================= HEADER ================= */

    .header {
      background: #166534;
      color: white;
      padding: 18px 16px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 21px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 12px;
      opacity: .85;
      margin-top: 3px;
    }

    .refresh-btn {
      border: 0;
      background: rgba(255,255,255,.15);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 19px;
      cursor: pointer;
    }

    /* ================= CONTENT ================= */

    .content {
      padding: 14px;
      padding-bottom: 85px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 18px 2px 10px;
    }

    /* ================= SUMMARY ================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-card {
      background: white;
      border-radius: 13px;
      padding: 14px;
      box-shadow: 0 1px 5px rgba(0,0,0,.06);
    }

    .summary-label {
      font-size: 12px;
      color: #6b7280;
    }

    .summary-value {
      font-size: 23px;
      font-weight: 700;
      margin-top: 5px;
    }

    /* ================= FARM CARD ================= */

    .farm-card {
      background: white;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
      overflow: hidden;
    }

    .farm-head {
      padding: 14px;
      border-bottom: 1px solid #edf0f2;
    }

    .farm-name {
      font-size: 16px;
      font-weight: 700;
    }

    .batch {
      font-size: 12px;
      color: #6b7280;
      margin-top: 3px;
    }

    .farm-stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      padding: 12px 8px;
    }

    .farm-stat {
      text-align: center;
      border-right: 1px solid #edf0f2;
    }

    .farm-stat:last-child {
      border-right: 0;
    }

    .stat-label {
      font-size: 11px;
      color: #7b8490;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 700;
      margin-top: 4px;
    }

    .farm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 12px 12px;
    }

    /* ================= BUTTONS ================= */

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #166534;
      color: white;
    }

    .btn-secondary {
      background: #eef2f0;
      color: #166534;
    }

    .btn-warning {
      background: #fff4d6;
      color: #8a5a00;
    }

    /* ================= STATUS ================= */

    .status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
    }

    .status-order {
      background: #fff0f0;
      color: #b42318;
    }

    .status-complete {
      background: #eaf7ee;
      color: #18743a;
    }

    /* ================= PANEL ================= */

    .panel {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 1px 5px rgba(0,0,0,.06);
    }

    .panel-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #f0f2f3;
      font-size: 13px;
    }

    .panel-row:last-child {
      border-bottom: 0;
    }

    .panel-label {
      color: #6b7280;
    }

    .panel-value {
      font-weight: 700;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      height: 64px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      z-index: 30;
    }

    .nav-btn {
      border: 0;
      background: white;
      color: #6b7280;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: #166534;
      font-weight: 700;
    }

    .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    /* ================= FORM ================= */

    .form-group {
      margin-bottom: 13px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: #59636e;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #d8dde2;
      border-radius: 9px;
      padding: 12px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #166534;
    }

    .full-btn {
      width: 100%;
      margin-top: 6px;
    }

    /* ================= LOADING ================= */

    .loading {
      text-align: center;
      padding: 35px 10px;
      color: #6b7280;
      font-size: 13px;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .success {
      background: #eaf7ee;
      color: #18743a;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }

  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="header-top">

      <div>
        <div class="title">KG Farms</div>
        <div class="subtitle">Poultry Management</div>
      </div>

      <button
        class="refresh-btn"
        onclick="loadAllData()">
        ↻
      </button>

    </div>

  </header>


  <!-- MAIN -->

  <main class="content">

    <div id="message"></div>

    <!-- DASHBOARD -->

    <section id="dashboardScreen">

      <div class="section-title">
        Overview
      </div>

      <div class="summary-grid">

        <div class="summary-card">
          <div class="summary-label">
            Active Batches
          </div>
          <div
            class="summary-value"
            id="totalBatches">
            0
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            Live Birds
          </div>
          <div
            class="summary-value"
            id="totalBirds">
            0
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            Orders Required
          </div>
          <div
            class="summary-value"
            id="ordersRequired">
            0
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-label">
            Upcoming Vaccines
          </div>
          <div
            class="summary-value"
            id="upcomingVaccines">
            0
          </div>
        </div>

      </div>


      <div class="section-title">
        Farms
      </div>

      <div id="farmList">
        <div class="loading">
          Loading farms...
        </div>
      </div>

    </section>


    <!-- ENTRY SCREEN -->

    <section
      id="entryScreen"
      class="hidden">

      <div class="section-title">
        Daily Farm Entry
      </div>

      <div class="panel">

        <div class="form-group">

          <label class="form-label">
            Date
          </label>

          <input
            type="date"
            id="entryDate">

        </div>


        <div class="form-group">

          <label class="form-label">
            Batch
          </label>

          <select
            id="entryBatch"
            onchange="updateEntryFarm()">

            <option value="">
              Select Batch
            </option>

          </select>

        </div>


        <div class="form-group">

          <label class="form-label">
            Farm
          </label>

          <input
            id="entryFarm"
            readonly
            placeholder="Auto">

        </div>


        <div class="form-group">

          <label class="form-label">
            Current Birds
          </label>

          <input
            id="entryBirds"
            readonly
            placeholder="Auto">

        </div>


        <div class="form-group">

          <label class="form-label">
            Mortality
          </label>

          <input
            type="number"
            min="0"
            id="entryMortality"
            placeholder="Enter mortality">

        </div>


        <div class="form-group">

          <label class="form-label">
            Feed Type
          </label>

          <select id="entryFeed">

            <option value="">
              Select Feed
            </option>

            <option value="BPSC">
              BPSC — Pre-Starter
            </option>

            <option value="BSC">
              BSC — Starter
            </option>

            <option value="BFP">
              BFP — Finisher
            </option>

          </select>

        </div>


        <div class="form-group">

          <label class="form-label">
            Remaining Feed Stock (50kg Bags)
          </label>

          <input
            type="number"
            min="0"
            step="1"
            id="entryStock"
            placeholder="Enter remaining bags">

        </div>


        <button
          class="btn btn-primary full-btn"
          onclick="saveDailyEntry()">

          Save Daily Entry

        </button>

      </div>

    </section>


    <!-- FEED SCREEN -->

    <section
      id="feedScreen"
      class="hidden">

      <div class="section-title">
        Feed Management
      </div>

      <div id="feedList">

        <div class="loading">
          Loading feed data...
        </div>

      </div>

    </section>

  </main>


  <!-- NAVIGATION -->

  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      id="navDashboard"
      onclick="showScreen('dashboard')">

      <span class="nav-icon">⌂</span>
      Dashboard

    </button>


    <button
      class="nav-btn"
      id="navEntry"
      onclick="showScreen('entry')">

      <span class="nav-icon">＋</span>
      Daily Entry

    </button>


    <button
      class="nav-btn"
      id="navFeed"
      onclick="showScreen('feed')">

      <span class="nav-icon">▣</span>
      Feed

    </button>

  </nav>

</div>


<script>

/* ==========================================================
   API
========================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzVV9-kxrknNyQroHlnY49lhrw7lWgPkNB8AmxkC_UgISCiaSxYrF1KsxRe2AGcku0B/exec";


/* ==========================================================
   GLOBAL DATA
========================================================== */

let dashboardData = [];
let feedData = [];
let ordersData = [];
let vaccineData = [];
let batchData = [];


/* ==========================================================
   INITIAL LOAD
========================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    setToday();

    loadAllData();

  }
);


/* ==========================================================
   LOAD API
========================================================== */

async function loadAllData() {

  showMessage(
    "Loading...",
    "success"
  );

  try {

    const response =
      await fetch(API_URL);

    const result =
      await response.json();


    if (
      result.status !== "success"
    ) {

      throw new Error(
        result.message ||
        "Unable to load data"
      );

    }


    dashboardData =
      cleanRows(result.data);

    feedData =
      cleanRows(result.feed);

    ordersData =
      cleanRows(result.orders);

    vaccineData =
      cleanRows(result.vaccines);

    batchData =
      cleanRows(result.batches);


    renderDashboard();

    renderFeed();

    populateBatchDropdown();


    hideMessage();

  }

  catch(error) {

    showMessage(
      error.message,
      "error"
    );

  }

}


/* ==========================================================
   CLEAN API ROWS
========================================================== */

function cleanRows(data) {

  if (
    !Array.isArray(data) ||
    data.length < 2
  ) {

    return [];

  }

  const headers =
    data[0];

  return data
    .slice(1)
    .filter(row =>
      row &&
      row.length &&
      row.some(value =>
        value !== ""
      )
    )
    .map(row => {

      const obj = {};

      headers.forEach(
        (header, index) => {

          obj[header] =
            row[index];

        }
      );

      return obj;

    });

}


/* ==========================================================
   DASHBOARD
========================================================== */

function renderDashboard() {

  const activeBatches =
    batchData.filter(
      row =>
        String(row["Status"] || "")
          .toLowerCase() !==
        "completed"
    );

  const totalBirds =
    dashboardData.reduce(
      (sum, row) =>
        sum +
        Number(row["Birds"] || 0),
      0
    );


  const ordersRequired =
    dashboardData.filter(
      row =>
        String(
          row["Next Order Need"] || ""
        ) ===
        "ORDER REQUIRED"
    ).length;


  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );


  const upcomingVaccines =
    vaccineData.filter(row => {

      const d =
        parseApiDate(
          row["Scheduled Date"]
        );

      return d && d >= today;

    }).length;


  document.getElementById(
    "totalBatches"
  ).textContent =
    activeBatches.length;


  document.getElementById(
    "totalBirds"
  ).textContent =
    totalBirds.toLocaleString();


  document.getElementById(
    "ordersRequired"
  ).textContent =
    ordersRequired;


  document.getElementById(
    "upcomingVaccines"
  ).textContent =
    upcomingVaccines;


  const list =
    document.getElementById(
      "farmList"
    );


  if (
    dashboardData.length === 0
  ) {

    list.innerHTML =
      `<div class="loading">
        No active farm data
       </div>`;

    return;

  }


  list.innerHTML =
    dashboardData
      .map(
        renderFarmCard
      )
      .join("");

}


/* ==========================================================
   FARM CARD
========================================================== */

function renderFarmCard(row) {

  const farm =
    row["Farm Name"] || "-";

  const batch =
    row["Batch ID"] || "-";

  const birds =
    Number(row["Birds"] || 0);

  const age =
    row["Age"] || "-";

  const feed =
    row["Current Feed"] || "-";

  const balance =
    Number(
      row["Balance To Be Supplied"] ||
      0
    );

  const orderNeed =
    row["Next Order Need"] ||
    "";


  const vaccine =
    row["Next Vaccine"] ||
    "None";

  const vaccineDate =
    formatDate(
      row["Vaccine Date"]
    );


  let statusHtml = "";

  if (
    orderNeed ===
    "ORDER REQUIRED"
  ) {

    statusHtml =
      `<span class="status status-order">
         ORDER REQUIRED
         ${balance} bags
       </span>`;

  } else {

    statusHtml =
      `<span class="status status-complete">
         FEED COMPLETE
       </span>`;

  }


  return `

    <div class="farm-card">

      <div class="farm-head">

        <div class="farm-name">
          ${escapeHtml(farm)}
        </div>

        <div class="batch">
          Batch ${escapeHtml(batch)}
        </div>

        ${statusHtml}

      </div>


      <div class="farm-stats">

        <div class="farm-stat">

          <div class="stat-label">
            Birds
          </div>

          <div class="stat-value">
            ${birds.toLocaleString()}
          </div>

        </div>


        <div class="farm-stat">

          <div class="stat-label">
            Age
          </div>

          <div class="stat-value">
            Day ${age}
          </div>

        </div>


        <div class="farm-stat">

          <div class="stat-label">
            Feed
          </div>

          <div class="stat-value">
            ${escapeHtml(feed || "-")}
          </div>

        </div>

      </div>


      <div class="panel-row"
           style="margin:0 12px">

        <span class="panel-label">
          Next Vaccine
        </span>

        <span class="panel-value">
          ${escapeHtml(vaccine)}
          ${vaccineDate ? " · " + vaccineDate : ""}
        </span>

      </div>


      <div class="farm-actions">

        <button
          class="btn btn-secondary"
          onclick="openDailyEntry('${escapeAttr(batch)}')">

          Daily Entry

        </button>


        <button
          class="btn ${
            orderNeed === "ORDER REQUIRED"
            ? "btn-warning"
            : "btn-secondary"
          }"
          onclick="showFeedForBatch('${escapeAttr(batch)}')">

          Feed

        </button>

      </div>

    </div>

  `;

}


/* ==========================================================
   FEED
========================================================== */

function renderFeed() {

  const list =
    document.getElementById(
      "feedList"
    );


  if (
    dashboardData.length === 0
  ) {

    list.innerHTML =
      `<div class="loading">
        No feed data
       </div>`;

    return;

  }


  list.innerHTML =
    dashboardData
      .map(row => {

        const farm =
          row["Farm Name"] || "-";

        const batch =
          row["Batch ID"] || "-";

        const feed =
          row["Current Feed"] || "-";

        const required =
          Number(
            row["Feed Required (Bags)"] ||
            0
          );

        const supplied =
          Number(
            row["Feed Supplied (Bags)"] ||
            0
          );

        const balance =
          Number(
            row["Balance To Be Supplied"] ||
            0
          );


        return `

          <div class="panel">

            <div class="farm-name">
              ${escapeHtml(farm)}
            </div>

            <div class="batch">
              ${escapeHtml(batch)}
            </div>

            <div class="panel-row">
              <span class="panel-label">
                Current Feed
              </span>
              <span class="panel-value">
                ${escapeHtml(feed)}
              </span>
            </div>

            <div class="panel-row">
              <span class="panel-label">
                Required
              </span>
              <span class="panel-value">
                ${required} bags
              </span>
            </div>

            <div class="panel-row">
              <span class="panel-label">
                Supplied
              </span>
              <span class="panel-value">
                ${supplied} bags
              </span>
            </div>

            <div class="panel-row">
              <span class="panel-label">
                To Be Supplied
              </span>
              <span class="panel-value">
                ${balance} bags
              </span>
            </div>

            ${
              balance > 0
              ? `
                <button
                  class="btn btn-primary full-btn"
                  onclick="createOrder('${escapeAttr(batch)}')">
                  Create Feed Order
                </button>
              `
              : `
                <div class="status status-complete">
                  COMPLETE
                </div>
              `
            }

          </div>

        `;

      })
      .join("");

}


/* ==========================================================
   NAVIGATION
========================================================== */

function showScreen(screen) {

  document
    .getElementById("dashboardScreen")
    .classList.toggle(
      "hidden",
      screen !== "dashboard"
    );

  document
    .getElementById("entryScreen")
    .classList.toggle(
      "hidden",
      screen !== "entry"
    );

  document
    .getElementById("feedScreen")
    .classList.toggle(
      "hidden",
      screen !== "feed"
    );


  document
    .getElementById("navDashboard")
    .classList.toggle(
      "active",
      screen === "dashboard"
    );

  document
    .getElementById("navEntry")
    .classList.toggle(
      "active",
      screen === "entry"
    );

  document
    .getElementById("navFeed")
    .classList.toggle(
      "active",
      screen === "feed"
    );

}


/* ==========================================================
   BATCH DROPDOWN
========================================================== */

function populateBatchDropdown() {

  const select =
    document.getElementById(
      "entryBatch"
    );


  select.innerHTML =
    `<option value="">
      Select Batch
     </option>`;


  batchData.forEach(row => {

    const id =
      row["Batch ID"];

    const farm =
      row["Farm Name"];


    if (!id) {
      return;
    }


    const option =
      document.createElement(
        "option"
      );

    option.value = id;

    option.textContent =
      `${id} — ${farm || ""}`;

    select.appendChild(
      option
    );

  });

}


/* ==========================================================
   ENTRY FARM
========================================================== */

function updateEntryFarm() {

  const batchId =
    document.getElementById(
      "entryBatch"
    ).value;


  const batch =
    batchData.find(
      row =>
        String(
          row["Batch ID"]
        ) === batchId
    );


  if (!batch) {

    document.getElementById(
      "entryFarm"
    ).value = "";

    document.getElementById(
      "entryBirds"
    ).value = "";

    return;

  }


  document.getElementById(
    "entryFarm"
  ).value =
    batch["Farm Name"] || "";


  document.getElementById(
    "entryBirds"
  ).value =
    Number(
      batch["Current Birds"] || 0
    );

}


/* ==========================================================
   OPEN DAILY ENTRY
========================================================== */

function openDailyEntry(batchId) {

  showScreen("entry");

  document.getElementById(
    "entryBatch"
  ).value =
    batchId;

  updateEntryFarm();

}


/* ==========================================================
   SAVE DAILY ENTRY
========================================================== */

async function saveDailyEntry() {

  const date =
    document.getElementById(
      "entryDate"
    ).value;

  const batchId =
    document.getElementById(
      "entryBatch"
    ).value;

  const mortality =
    Number(
      document.getElementById(
        "entryMortality"
      ).value || 0
    );

  const feedType =
    document.getElementById(
      "entryFeed"
    ).value;

  const remainingFeedStock =
    document.getElementById(
      "entryStock"
    ).value;


  if (!date) {

    showMessage(
      "Select date",
      "error"
    );

    return;

  }


  if (!batchId) {

    showMessage(
      "Select batch",
      "error"
    );

    return;

  }


  if (mortality < 0) {

    showMessage(
      "Mortality cannot be negative",
      "error"
    );

    return;

  }


  if (!feedType) {

    showMessage(
      "Select feed type",
      "error"
    );

    return;

  }


  const batch =
    batchData.find(
      row =>
        String(
          row["Batch ID"]
        ) === batchId
    );


  const farmName =
    batch
      ? batch["Farm Name"]
      : "";


  try {

    showMessage(
      "Saving...",
      "success"
    );


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action:
                "dailyEntry",

              date:
                date,

              batchId:
                batchId,

              farmName:
                farmName,

              mortality:
                mortality,

              feedType:
                feedType,

              remainingFeedStock:
                remainingFeedStock

            })

        }
      );


    const result =
      await response.json();


    if (
      result.status !==
      "success"
    ) {

      throw new Error(
        result.message ||
        "Unable to save entry"
      );

    }


    showMessage(
      "Daily entry saved successfully",
      "success"
    );


    document.getElementById(
      "entryMortality"
    ).value = "";

    document.getElementById(
      "entryStock"
    ).value = "";


    await loadAllData();

    showScreen("dashboard");

  }

  catch(error) {

    showMessage(
      error.message,
      "error"
    );

  }

}


/* ==========================================================
   CREATE ORDER
========================================================== */

async function createOrder(
  batchId
) {

  const row =
    dashboardData.find(
      item =>
        String(
          item["Batch ID"]
        ) === batchId
    );


  if (!row) {

    showMessage(
      "Batch data not found",
      "error"
    );

    return;

  }


  const feedType =
    row["Current Feed"];


  const quantity =
    Number(
      row["Balance To Be Supplied"] ||
      0
    );


  if (
    !feedType ||
    quantity <= 0
  ) {

    showMessage(
      "No feed order required",
      "error"
    );

    return;

  }


  try {

    showMessage(
      "Creating order...",
      "success"
    );


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action:
                "createFeedOrder",

              orderDate:
                todayString(),

              farmName:
                row["Farm Name"],

              batchId:
                batchId,

              feedType:
                feedType,

              quantity:
                quantity,

              remarks:
                "Balance requirement"

            })

          }
        );


    const result =
      await response.json();


    if (
      result.status ===
      "duplicate"
    ) {

      showMessage(
        result.message,
        "error"
      );

      return;

    }


    if (
      result.status !==
      "success"
    ) {

      throw new Error(
        result.message ||
        "Unable to create order"
      );

    }


    showMessage(
      "Feed order created successfully",
      "success"
    );


    await loadAllData();

  }

  catch(error) {

    showMessage(
      error.message,
      "error"
    );

  }

}


/* ==========================================================
   SHOW FEED
========================================================== */

function showFeedForBatch(
  batchId
) {

  showScreen("feed");

  const cards =
    document.querySelectorAll(
      "#feedList .panel"
    );


  cards.forEach(card => {

    const text =
      card.textContent || "";

    const matching =
      text.includes(batchId);

    card.style.display =
      matching
      ? ""
      : "none";

  });

}


/* ==========================================================
   DATE HELPERS
========================================================== */

function setToday() {

  document.getElementById(
    "entryDate"
  ).value =
    todayString();

}


function todayString() {

  const d =
    new Date();

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");


  return `${year}-${month}-${day}`;

}


function parseApiDate(
  value
) {

  if (!value) {
    return null;
  }


  const d =
    new Date(value);


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return null;

  }


  d.setHours(
    0,0,0,0
  );

  return d;

}


function formatDate(
  value
) {

  const d =
    parseApiDate(value);


  if (!d) {
    return "";
  }


  return d.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


/* ==========================================================
   UI HELPERS
========================================================== */

function showMessage(
  text,
  type
) {

  const el =
    document.getElementById(
      "message"
    );


  el.className =
    type === "error"
      ? "error"
      : "success";


  el.textContent =
    text;

}


function hideMessage() {

  document.getElementById(
    "message"
  ).innerHTML = "";

}


function escapeHtml(
  value
) {

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(
  value
) {

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}
